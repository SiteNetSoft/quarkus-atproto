# quarkus-atproto sample: sign in with an AT Protocol (Bluesky) account and publish Standard.site records.

# Both record types, create and update, plus image blobs (covers). The authorization server only grants what the
# client registered, and the granted scope (AtprotoUser.scope()) can be narrower than this request.
quarkus.atproto.oauth.scope=atproto repo:site.standard.publication?action=create&action=update repo:site.standard.document?action=create&action=update blob:image/*
quarkus.atproto.oauth.client-name=quarkus-atproto sample

# Production (a confidential client) needs, set from the environment:
#   quarkus.atproto.oauth.client-base-url=https://your-app.example.com
#   quarkus.atproto.oauth.signing-key.location=/run/secrets/atproto-client-key.pem
#   quarkus.atproto.oauth.session.encryption-key=<at least 32 random characters>
# In dev mode none of this is needed: the localhost development client is used (see docs/modules/ROOT/pages/live-check.adoc).

# Link mode stands in for an application with its own accounts: basic auth with embedded users. Basic auth and the
# embedded realm are fixed at build time, so they are on in every profile; only the "link" profile has users.
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true

%link.quarkus.atproto.oauth.mode=link
%link.quarkus.security.users.embedded.users.ann=ann-password
%link.quarkus.security.users.embedded.roles.ann=member

# @QuarkusTest-style tests against loopback fakes: http and private addresses allowed.
# The packaged-app ITs get these, and the fakes' URLs, from their test resource (org.acme.atproto.AtprotoFakes).
%test.quarkus.safe-fetch.https-only=false
%test.quarkus.safe-fetch.allow-private-addresses=true
